# HotelEase database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hotelease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Set your local MySQL password here (leave blank if none)
spring.datasource.password=monishadurairaj
server.port=8085
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Payment Gateway Configuration (Environment configurable)
hotelease.payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_HotelEase123}
hotelease.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:secret_HotelEase_Secure_Key_456}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.hotelease=DEBUG
